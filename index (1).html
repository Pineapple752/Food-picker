<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Food hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0a;
    --ink: #f5f5f5;
    --muted: #a3a3a3;
    --accent: #ff7a00;
    --accent-ink: #0a0a0a;
    --chip: #262626;
    --chip-on: #ff7a00;
    --chip-on-ink: #0a0a0a;
    --card: #171717;
    --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(1.5rem + env(safe-area-inset-top, 0px)) calc(1rem + env(safe-area-inset-right, 0px)) calc(2rem + env(safe-area-inset-bottom, 0px)) calc(1rem + env(safe-area-inset-left, 0px));
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  main { width: 100%; max-width: 40rem; }
  h1 { font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; font-weight: 700; font-size: clamp(2.2rem, 11vw, 3.25rem); line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 1.5rem; color: #fff; width: fit-content; transform-origin: center; }
  h1 .hub { display: inline-block; background: var(--accent); color: #000; padding: .02em .3em .08em; border-radius: .3em; }

  .result {
    background: var(--card);
    border-radius: 1.25rem;
    padding: 2rem 1.5rem 1.75rem;
    min-height: 15rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .name {
    font-weight: 800;
    font-size: clamp(2.25rem, 9vw, 4rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin: 0;
    overflow-wrap: anywhere;
  }
  .name.spinning { color: var(--muted); }
  .cuisine { margin: 1rem 0 0; font-size: 1.2rem; color: var(--accent); font-weight: 500; }
  .address { margin: .35rem 0 0; font-size: 1.05rem; color: var(--muted); }
  .map { display: inline-block; margin-top: 1rem; padding: .6rem 0; color: var(--ink); font-weight: 500; }
  .map:hover { color: var(--accent); }
  .empty { margin: 0; font-size: 1.3rem; color: var(--muted); }

  button.pick {
    position: sticky;
    bottom: calc(.75rem + env(safe-area-inset-bottom, 0px));
    z-index: 5;
    box-shadow: 0 6px 20px rgba(0,0,0,.25);
    min-height: 3.75rem;
    touch-action: manipulation;
    margin-top: 1.25rem;
    width: 100%;
    font: inherit;
    font-weight: 800;
    font-size: 1.35rem;
    padding: 1.1rem;
    border: 0;
    border-radius: 1rem;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }
  button.pick:active { transform: scale(.99); }
  button.pick:disabled { opacity: .5; cursor: not-allowed; }

  fieldset { border: 0; padding: 0; margin: 2rem 0 0; }
  legend { font-weight: 500; color: var(--muted); padding: 0; margin-bottom: .6rem; }
  .chips { display: flex; flex-wrap: wrap; gap: .5rem; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
  .chip span {
    display: block;
    padding: .7rem 1.05rem;
    border-radius: 999px;
    background: var(--chip);
    font-size: .95rem;
  }
  .chip input:checked + span { background: var(--chip-on); color: var(--chip-on-ink); }
  .chip input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.pick:focus-visible, .map:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .count { margin-top: 1rem; color: var(--muted); font-size: .9rem; }

  .manage { margin-top: 2.25rem; }
  .manage summary { cursor: pointer; font-weight: 500; color: var(--muted); }
  .manage summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .manage[open] summary { margin-bottom: 1rem; }
  #add { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
  #add .wide { grid-column: 1 / -1; }
  .manage input[type=text], .manage input[type=search], .manage input[type=number] {
    font: inherit; font-size: 1rem; width: 100%; min-height: 2.9rem;
    padding: .6rem .75rem; border-radius: .6rem;
    border: 2px solid var(--chip); background: var(--card); color: var(--ink);
  }
  .manage input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  button.small {
    font: inherit; font-weight: 800; font-size: 1rem; cursor: pointer; min-height: 2.9rem; touch-action: manipulation;
    padding: .6rem 1rem; border: 0; border-radius: .6rem;
    background: var(--chip-on); color: var(--chip-on-ink);
  }
  button.small.ghost { background: var(--chip); color: var(--ink); font-weight: 500; }
  button.small:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #filter { margin-top: 1.25rem; }
  #items { list-style: none; margin: .75rem 0 0; padding: 0; max-height: min(24rem, 55vh); overflow-y: auto; -webkit-overflow-scrolling: touch; border-radius: .75rem; background: var(--card); }
  #items li { display: flex; align-items: center; gap: .75rem; padding: .55rem .75rem; border-bottom: 1px solid var(--chip); }
  #items li:last-child { border-bottom: 0; }
  #items .info { flex: 1; min-width: 0; }
  #items .nm { display: block; font-weight: 500; overflow-wrap: anywhere; }
  #items .sub { display: block; font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
  #items button { font: inherit; font-size: .9rem; cursor: pointer; min-height: 2.75rem; padding: .35rem .9rem; border-radius: 999px; border: 2px solid var(--chip); background: transparent; color: var(--ink); }
  #items button:hover { border-color: var(--accent); color: var(--accent); }
  #items button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .manage .row { display: flex; gap: .75rem; align-items: center; margin-top: 1rem; flex-wrap: wrap; }
  .manage .note { color: var(--muted); font-size: .85rem; margin: 0; }
  .formmsg { grid-column: 1 / -1; margin: 0; font-size: .9rem; color: var(--accent); min-height: 1.2em; }
  @media (max-width: 30rem) { #add { grid-template-columns: 1fr; } }

  .types { display: grid; grid-template-columns: repeat(4, 1fr); gap: .4rem; margin-bottom: 1rem; }
  .seg { position: relative; }
  .seg input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .seg input:disabled { cursor: default; }
  .seg span { display: block; text-align: center; padding: .9rem .25rem; border-radius: .9rem; background: var(--chip); font-weight: 500; font-size: .95rem; }
  .seg input:checked + span { background: var(--chip-on); color: var(--chip-on-ink); font-weight: 800; }
  .seg input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
  .manage select {
    font: inherit; font-size: 1rem; width: 100%; min-height: 2.9rem;
    padding: .6rem .75rem; border-radius: .6rem;
    border: 2px solid var(--chip); background: var(--card); color: var(--ink);
  }
  .manage select:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  @media (max-width: 22rem) { .seg span { font-size: .85rem; } }

  /* intro: only the title is visible; everything else fades in when it settles */
  body.intro, body.moving { overflow: hidden; }
  body.intro main > *:not(h1) { opacity: 0; pointer-events: none; }
  body.moving main > *:not(h1) { transition: opacity .8s ease .5s; }
  .hint { position: fixed; left: 0; right: 0; bottom: calc(2rem + env(safe-area-inset-bottom, 0px)); text-align: center; color: var(--muted); font-size: 1rem; margin: 0; animation: hintpulse 1.6s ease-in-out infinite; }
  .hint[hidden] { display: none; }
  @keyframes hintpulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  .price { margin-top: .9rem; }
  .bills { font-size: 1.6rem; letter-spacing: .1em; line-height: 1; }
  .bills .off { opacity: .2; filter: grayscale(1); }
  .avg { margin-top: .4rem; color: var(--muted); font-size: .95rem; }
  .rate { margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--chip); }
  .rate-top { display: flex; align-items: center; gap: .6rem; min-height: 2.6rem; }
  .rate-face { font-size: 2.2rem; line-height: 1; }
  .rate-val { font-weight: 800; font-size: 1.3rem; }
  .rate.unrated .rate-val { font-weight: 500; font-size: 1rem; color: var(--muted); }
  .linkbtn { margin-left: auto; font: inherit; font-size: .9rem; background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: .5rem; min-height: 2.5rem; }
  .linkbtn[hidden] { display: none; }
  .linkbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .rate input[type=range] { display: block; width: 100%; height: 2rem; margin: .5rem 0 0; accent-color: var(--accent); cursor: pointer; }
  .rate input[type=range]:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .rate.unrated input[type=range] { opacity: .55; }
  .rate-scale { display: flex; justify-content: space-between; color: var(--muted); font-size: .8rem; }

  .small:disabled { opacity: .45; cursor: default; }
  .rate .savebtn { width: 100%; margin-top: .75rem; }
  .tools { display: flex; gap: .5rem; margin-top: .75rem; }
  .tools .tool { flex: 1; font: inherit; font-size: 1rem; font-weight: 500; min-height: 2.9rem; padding: .5rem 1rem; border: 0; border-radius: .9rem; background: var(--chip); color: var(--ink); cursor: pointer; touch-action: manipulation; }
  .tools .tool:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  dialog { font-family: var(--font); background: var(--card); color: var(--ink); border: 0; border-radius: 1.25rem; padding: 1.25rem; width: min(92vw, 34rem); max-height: 80vh; }
  dialog[open] { display: flex; flex-direction: column; gap: .9rem; }
  dialog::backdrop { background: rgba(0, 0, 0, .75); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .dlg-head h2 { margin: 0; font-size: 1.4rem; }
  .dlg-head form { margin: 0; }
  #historyList { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
  #historyList li { border-bottom: 1px solid var(--chip); }
  #historyList li:last-child { border-bottom: 0; }
  .hrow { display: flex; align-items: center; gap: .75rem; width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0; padding: .8rem .25rem; min-height: 3.25rem; cursor: pointer; }
  .hrow:disabled { cursor: default; opacity: .55; }
  .hrow:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; border-radius: .5rem; }
  .hrow .info { flex: 1; min-width: 0; }
  .hrow .nm { display: block; font-weight: 800; overflow-wrap: anywhere; }
  .hrow .sub { display: block; font-size: .85rem; color: var(--muted); }
  .hrow .rt { white-space: nowrap; }
  .empty-hist { color: var(--muted); padding: .8rem .25rem; }
</style>
</head>
<body class="intro">
<main>
  <h1>Food <span class="hub">hub</span></h1>

  <div class="types" id="types" role="radiogroup" aria-label="Type of place"></div>

  <section class="result" aria-live="polite" id="result">
    <p class="empty">Press the button to pick a place.</p>
  </section>

  <button class="pick" id="pick" type="button">Pick a place</button>

  <div class="tools">
    <button class="tool" id="historyBtn" type="button">🕘 History</button>
    <button class="tool" id="soundBtn" type="button" aria-pressed="true">🔊 Sound on</button>
  </div>

  <fieldset>
    <legend>Limit to</legend>
    <div class="chips" id="chips"></div>
  </fieldset>
  <p class="count" id="count"></p>

  <details class="manage">
    <summary>Edit the list</summary>
    <form id="add" autocomplete="off">
      <input class="wide" type="text" id="f-name" placeholder="Name" aria-label="Name" required maxlength="80">
      <input type="text" id="f-addr" placeholder="Address (optional)" aria-label="Address" maxlength="120">
      <input type="text" id="f-cuisine" placeholder="Cuisine (optional)" aria-label="Cuisine" maxlength="80">
      <select class="wide" id="f-type" aria-label="Type of place"><option value="food">Food</option><option value="fast food">Fast food</option><option value="dessert">Dessert</option><option value="drinks">Drinks</option></select>
      <input class="wide" type="text" id="f-cat" list="cats" placeholder="Category (pick one or type a new one)" aria-label="Category" required maxlength="40">
      <datalist id="cats"></datalist>
      <input class="wide" type="number" id="f-price" inputmode="decimal" min="0" step="0.5" placeholder="Average item price in $ (optional)" aria-label="Average item price in dollars">
      <button class="small wide" type="submit">Add place</button>
      <p class="formmsg" id="formmsg" role="status"></p>
    </form>
    <input type="search" id="filter" placeholder="Search the list" aria-label="Search the list">
    <ul id="items"></ul>
    <div class="row">
      <button class="small ghost" type="button" id="reset">Reset to original list</button>
      <p class="note">Changes are saved in this browser only.</p>
    </div>
  </details>
</main>
<p class="hint" id="hint" hidden>Tap to start</p>
<dialog id="historyDlg" aria-labelledby="historyTitle">
  <div class="dlg-head">
    <h2 id="historyTitle">History</h2>
    <form method="dialog"><button class="small ghost" type="submit">Close</button></form>
  </div>
  <ul id="historyList"></ul>
  <button class="small ghost" type="button" id="clearHistory">Clear history</button>
</dialog>

  "FrogLegs": 7, "Sharetea": 7, "Top Pot Doughnuts": 4
};
DEFAULT_PLACES.forEach(p => p.push(PRICES[p[0]] ?? null));
let type = "food";

const KEY = "redmond-eats-list-v1";
let places = DEFAULT_PLACES.map(p => p.slice());
try {
  const saved = JSON.parse(localStorage.getItem(KEY));
  if (Array.isArray(saved) && saved.every(p => Array.isArray(p) && (p.length >= 4 && p.length <= 6) && p.slice(0, 4).every(x => typeof x === "string"))) {
    places = saved.map(p => [p[0], p[1], p[2], p[3], TYPES.some(t => t.id === p[4]) ? p[4] : typeOf(p[0], p[3]), typeof p[5] === "number" && p[5] > 0 ? p[5] : (PRICES[p[0]] ?? null)]);
  }
} catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(places)); } catch (e) {} }
const RKEY = "redmond-eats-ratings-v1";
let ratings = Object.create(null);
try {
  const r = JSON.parse(localStorage.getItem(RKEY));
  if (r && typeof r === "object" && !Array.isArray(r)) Object.assign(ratings, r);
} catch (e) {}
function saveRatings() { try { localStorage.setItem(RKEY, JSON.stringify(ratings)); } catch (e) {} }
function faceFor(n) { return n >= 10 ? "\u{1F60D}" : n >= 7 ? "\u{1F600}" : n >= 4 ? "\u{1F610}" : "\u{1F92E}"; }
function priceTier(avg) {
  if (typeof avg !== "number" || !(avg > 0)) return 0;
  return avg < 10 ? 1 : avg <= 15 ? 2 : avg <= 25 ? 3 : avg <= 40 ? 4 : 5;
}
function money(avg) { return "$" + (Number.isInteger(avg) ? avg : avg.toFixed(2)); }

const HKEY = "redmond-eats-history-v1";
let history = [];
try {
  const h = JSON.parse(localStorage.getItem(HKEY));
  if (Array.isArray(h)) history = h.filter(x => x && typeof x.n === "string" && typeof x.t === "number").slice(0, 100);
} catch (e) {}
function saveHistory() { try { localStorage.setItem(HKEY, JSON.stringify(history)); } catch (e) {} }

const SKEY = "redmond-eats-sound-v1";
let soundOn = true;
try { if (localStorage.getItem(SKEY) === "off") soundOn = false; } catch (e) {}

// Sound effects for the pick animation, synthesised with Web Audio (no extra files).
let sfx = null;
function sfxContext() {
  if (!soundOn) return null;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!sfx) { try { sfx = new AC(); } catch (e) { return null; } }
  if (sfx.state === "suspended") sfx.resume().catch(() => {});
  return sfx;
}
function blip(freq, dur, vol, wave, delay) {
  const c = sfxContext();
  if (!c) return;
  const t = c.currentTime + (delay || 0);
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = wave || "triangle";
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g);
  g.connect(c.destination);
  o.start(t);
  o.stop(t + dur + 0.03);
}
function tickSound(i, total) { blip(520 + (i / total) * 520, 0.05, 0.2, "triangle"); }
function dingSound() { blip(880, 0.3, 0.22, "sine"); blip(1318.5, 0.5, 0.2, "sine", 0.11); }

const categories = all => [...new Set(places.filter(p => all || p[4] === type).map(p => p[3]))];
const chipsEl = document.getElementById("chips");
const resultEl = document.getElementById("result");
const pickBtn = document.getElementById("pick");
const countEl = document.getElementById("count");
let last = null;
let busy = false;

function renderChips() {
  const off = new Set([...chipsEl.querySelectorAll("input:not(:checked)")].map(i => i.value));
  chipsEl.textContent = "";
  categories().forEach(cat => {
    const label = document.createElement("label");
    label.className = "chip";
    label.innerHTML = '<input type="checkbox"><span></span>';
    const input = label.querySelector("input");
    input.value = cat;
    input.checked = !off.has(cat);
    label.querySelector("span").textContent = cat;
    input.addEventListener("change", updateCount);
    chipsEl.appendChild(label);
  });
  const dl = document.getElementById("cats");
  dl.textContent = "";
  categories(true).forEach(cat => {
    const o = document.createElement("option");
    o.value = cat;
    dl.appendChild(o);
  });
  updateCount();
}

function pool() {
  const on = [...chipsEl.querySelectorAll("input:checked")].map(i => i.value);
  return places.filter(p => p[4] === type && on.includes(p[3]));
}

function updateCount() {
  const n = pool().length;
  countEl.textContent = n + (n === 1 ? " place" : " places") + " in the running";
  pickBtn.disabled = n === 0;
}

function show(place, spinning) {
  resultEl.textContent = "";
  const h = document.createElement("h2");
  h.className = "name" + (spinning ? " spinning" : "");
  h.textContent = place[0];
  resultEl.appendChild(h);
  if (spinning) return;

  const c = document.createElement("p");
  c.className = "cuisine";
  c.textContent = place[2];
  const a = document.createElement("p");
  a.className = "address";
  a.textContent = place[1];
  const m = document.createElement("a");
  m.className = "map";
  m.textContent = "Open in Google Maps";
  m.target = "_blank";
  m.rel = "noopener";
  const q = place[0] + " " + (place[1].startsWith("Redmond") ? "Redmond, WA" : place[1] + ", Redmond, WA");
  m.href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
  resultEl.append(c, a, priceEl(place), rateEl(place), m);
}

function priceEl(place) {
  const wrap = document.createElement("div");
  wrap.className = "price";
  const avg = place[5];
  const tier = priceTier(avg);
  if (!tier) {
    const n = document.createElement("div");
    n.className = "avg";
    n.textContent = "Price not set";
    wrap.appendChild(n);
    return wrap;
  }
  const bills = document.createElement("div");
  bills.className = "bills";
  bills.setAttribute("role", "img");
  bills.setAttribute("aria-label", "Price level " + tier + " of 5");
  for (let i = 1; i <= 5; i++) {
    const b = document.createElement("span");
    b.textContent = "\u{1F4B5}";
    if (i > tier) b.className = "off";
    bills.appendChild(b);
  }
  const note = document.createElement("div");
  note.className = "avg";
  note.textContent = "Avg item \u2248 " + money(avg);
  wrap.append(bills, note);
  return wrap;
}

function rateEl(place) {
  const name = place[0];
  const wrap = document.createElement("div");
  wrap.className = "rate";
  const top = document.createElement("div");
  top.className = "rate-top";
  const face = document.createElement("span");
  face.className = "rate-face";
  const val = document.createElement("span");
  val.className = "rate-val";
  const clear = document.createElement("button");
  clear.type = "button";
  clear.className = "linkbtn";
  clear.textContent = "Clear";
  top.append(face, val, clear);

  const slider = document.createElement("input");
  slider.type = "range";
  slider.min = "1";
  slider.max = "10";
  slider.step = "1";
  slider.setAttribute("aria-label", "Rate " + name + " from 1 to 10");

  const scale = document.createElement("div");
  scale.className = "rate-scale";
  scale.innerHTML = "<span>1</span><span>10</span>";

  const save = document.createElement("button");
  save.type = "button";
  save.className = "small savebtn";

  let draft = ratings[name] || null;   // what the slider shows; only saved when Save is pressed

  function paint() {
    const saved = ratings[name];
    if (draft) {
      slider.value = draft;
      face.textContent = faceFor(draft);
      val.textContent = draft + "/10";
      wrap.classList.remove("unrated");
    } else {
      slider.value = 5;
      face.textContent = "";
      val.textContent = "Slide to rate";
      wrap.classList.add("unrated");
    }
    clear.hidden = !saved;
    const dirty = !!draft && draft !== saved;
    save.disabled = !dirty;
    save.textContent = saved && !dirty ? "Saved \u2713" : "Save rating";
  }
  function move() {
    draft = parseInt(slider.value, 10);
    paint();
  }
  ["input", "change", "pointerup"].forEach(t => slider.addEventListener(t, move));
  save.addEventListener("click", () => {
    if (!draft) return;
    ratings[name] = draft;
    saveRatings();
    paint();
    renderItems();
  });
  clear.addEventListener("click", () => {
    delete ratings[name];
    draft = null;
    saveRatings();
    paint();
    renderItems();
  });
  paint();
  wrap.append(top, slider, scale, save);
  return wrap;
}

function choose() {
  const p = pool();
  if (!p.length) return null;
  let pick;
  do { pick = p[Math.floor(Math.random() * p.length)]; } while (p.length > 1 && pick === last);
  return pick;
}

pickBtn.addEventListener("click", () => {
  if (busy) return;
  const final = choose();
  if (!final) return;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  last = final;
  if (reduce) { show(final, false); dingSound(); recordVisit(final); return; }

  busy = true;
  pickBtn.disabled = true;
  setTypesDisabled(true);
  const p = pool();
  let i = 0;
  const total = 14;
  (function tick() {
    if (i < total) {
      show(p[Math.floor(Math.random() * p.length)], true);
      tickSound(i, total);
      i++;
      setTimeout(tick, 45 + i * 14);
    } else {
      show(final, false);
      dingSound();
      recordVisit(final);
      busy = false;
      pickBtn.disabled = false;
      setTypesDisabled(false);
      pickBtn.textContent = "Pick again";
    }
  })();
});

// ---- Edit the list ----
const itemsEl = document.getElementById("items");
const filterEl = document.getElementById("filter");
const msgEl = document.getElementById("formmsg");

function renderItems() {
  const q = filterEl.value.trim().toLowerCase();
  itemsEl.textContent = "";
  places.forEach(p => {
    if (q && !(p[0] + " " + p[2] + " " + p[3]).toLowerCase().includes(q)) return;
    const li = document.createElement("li");
    const info = document.createElement("div");
    info.className = "info";
    const nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = p[0];
    const sub = document.createElement("span");
    sub.className = "sub";
    sub.textContent = p[2] + " \u2022 " + p[1] + " \u2022 " + typeLabel(p[4]) +
      (p[5] ? " \u2022 " + "\u{1F4B5}".repeat(priceTier(p[5])) + " " + money(p[5]) : "") +
      (ratings[p[0]] ? " \u2022 " + faceFor(ratings[p[0]]) + " " + ratings[p[0]] + "/10" : "");
    info.append(nm, sub);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "Remove";
    btn.setAttribute("aria-label", "Remove " + p[0]);
    btn.addEventListener("click", () => {
      places = places.filter(x => x !== p);
      if (last === p) last = null;
      save();
      renderChips();
      renderItems();
    });
    li.append(info, btn);
    itemsEl.appendChild(li);
  });
  if (!itemsEl.children.length) {
    const li = document.createElement("li");
    li.textContent = places.length ? "No matches." : "The list is empty. Add a place above.";
    itemsEl.appendChild(li);
  }
}

document.getElementById("add").addEventListener("submit", e => {
  e.preventDefault();
  const name = document.getElementById("f-name").value.trim();
  const addr = document.getElementById("f-addr").value.trim() || "Redmond, WA";
  const cat = document.getElementById("f-cat").value.trim();
  const cuisine = document.getElementById("f-cuisine").value.trim() || cat;
  if (!name || !cat) return;
  if (places.some(p => p[0].toLowerCase() === name.toLowerCase())) {
    msgEl.textContent = name + " is already on the list.";
    return;
  }
  const t = document.getElementById("f-type").value;
  const priceRaw = parseFloat(document.getElementById("f-price").value);
  places.push([name, addr, cuisine, cat, t, priceRaw > 0 ? priceRaw : null]);
  save();
  e.target.reset();
  document.getElementById("f-type").value = type;
  msgEl.textContent = "Added " + name + " to " + typeLabel(t) + ".";
  renderChips();
  renderItems();
});

filterEl.addEventListener("input", renderItems);

document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("Replace the list with the original one? Your additions and removals will be lost.")) return;
  places = DEFAULT_PLACES.map(p => p.slice());
  last = null;
  save();
  renderChips();
  renderItems();
});

// ---- Type selector ----
const typesEl = document.getElementById("types");
function typeLabel(id) { const t = TYPES.find(x => x.id === id); return t ? t.label : id; }
function setTypesDisabled(b) { typesEl.querySelectorAll("input").forEach(i => { i.disabled = b; }); }

TYPES.forEach(t => {
  const label = document.createElement("label");
  label.className = "seg";
  label.innerHTML = '<input type="radio" name="type"><span></span>';
  const input = label.querySelector("input");
  input.value = t.id;
  input.checked = t.id === type;
  label.querySelector("span").textContent = t.label;
  input.addEventListener("change", () => {
    type = t.id;
    last = null;
    pickBtn.textContent = "Pick a place";
    resultEl.textContent = "";
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "Press the button to pick a place.";
    resultEl.appendChild(p);
    document.getElementById("f-type").value = type;
    renderChips();
  });
  typesEl.appendChild(label);
});

// ---- History and sound toggle ----
const historyBtn = document.getElementById("historyBtn");
const soundBtn = document.getElementById("soundBtn");
const historyDlg = document.getElementById("historyDlg");
const historyList = document.getElementById("historyList");

function updateHistoryBtn() {
  historyBtn.textContent = "\u{1F558} History" + (history.length ? " (" + history.length + ")" : "");
}
function recordVisit(place) {
  history.unshift({ n: place[0], t: Date.now() });
  history = history.slice(0, 100);
  saveHistory();
  updateHistoryBtn();
}
function showFromHistory(place) {
  if (busy) return;
  if (place[4] !== type) {
    type = place[4];
    typesEl.querySelectorAll("input").forEach(i => { i.checked = i.value === type; });
    document.getElementById("f-type").value = type;
    renderChips();
  }
  last = place;
  show(place, false);
  pickBtn.textContent = "Pick again";
  resultEl.scrollIntoView({ block: "center" });
}
function renderHistory() {
  historyList.textContent = "";
  if (!history.length) {
    const li = document.createElement("li");
    li.className = "empty-hist";
    li.textContent = "Nothing yet. Places you pick show up here.";
    historyList.appendChild(li);
    return;
  }
  history.forEach(h => {
    const place = places.find(x => x[0] === h.n);
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "hrow";
    const info = document.createElement("span");
    info.className = "info";
    const nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = h.n;
    const sub = document.createElement("span");
    sub.className = "sub";
    const d = new Date(h.t);
    const when = d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + ", " +
                 d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    sub.textContent = (place ? place[2] : "Removed from the list") + " \u2022 " + when;
    info.append(nm, sub);
    btn.appendChild(info);
    const r = ratings[h.n];
    if (r) {
      const rt = document.createElement("span");
      rt.className = "rt";
      rt.textContent = faceFor(r) + " " + r + "/10";
      btn.appendChild(rt);
    }
    if (place) {
      btn.addEventListener("click", () => { historyDlg.close(); showFromHistory(place); });
    } else {
      btn.disabled = true;
    }
    li.appendChild(btn);
    historyList.appendChild(li);
  });
}
historyBtn.addEventListener("click", () => {
  renderHistory();
  if (historyDlg.showModal) historyDlg.showModal(); else historyDlg.setAttribute("open", "");
});
historyDlg.addEventListener("click", e => { if (e.target === historyDlg) historyDlg.close(); });
document.getElementById("clearHistory").addEventListener("click", () => {
  if (!history.length) return;
  if (!confirm("Clear your history?")) return;
  history = [];
  saveHistory();
  updateHistoryBtn();
  renderHistory();
});

function paintSound() {
  soundBtn.textContent = soundOn ? "\u{1F50A} Sound on" : "\u{1F507} Sound off";
  soundBtn.setAttribute("aria-pressed", String(soundOn));
}
soundBtn.addEventListener("click", () => {
  soundOn = !soundOn;
  try { localStorage.setItem(SKEY, soundOn ? "on" : "off"); } catch (e) {}
  paintSound();
  if (soundOn) blip(880, 0.12, 0.2, "sine");
});
paintSound();
updateHistoryBtn();

renderChips();
renderItems();

  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    body.classList.remove("intro");
    return;
  }

  let phase = "hold";
  function zoom() {
    title.style.transition = "none";
    title.style.transform = "none";
    const r = title.getBoundingClientRect();
    const s = Math.min(window.innerWidth * 0.8 / r.width, 5);
    const dx = window.innerWidth / 2 - (r.left + r.width / 2);
    const dy = window.innerHeight / 2 - (r.top + r.height / 2);
    title.style.transform = "translate(" + dx + "px, " + dy + "px) scale(" + s + ")";
  }
  window.scrollTo(0, 0);
  zoom();
  window.addEventListener("resize", () => { if (phase === "hold") zoom(); });

  function release() {
    phase = "move";
    body.classList.add("moving");
    title.getBoundingClientRect(); // commit the zoomed state before animating
    title.style.transition = "transform " + MOVE + "ms cubic-bezier(.65, 0, .25, 1)";
    title.style.transform = "none";
    body.classList.remove("intro");
    setTimeout(() => {
      title.style.transition = "";
      title.style.transform = "";
      body.classList.remove("moving");
      phase = "done";
    }, MOVE + 150);
  }

  let started = false;
  function begin() {
    if (started) return;
    started = true;
    hint.hidden = true;
    setTimeout(release, HOLD);
  }

  const audio = new Audio(AUDIO_SRC);
  audio.preload = "auto";
  audio.volume = 1;

  // Fallback for pages where <audio> files are blocked (some sandboxed previews):
  // decode the same sound with Web Audio instead.
  let ctx = null, bufP = null;
  function webAudio(gesture) {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return Promise.reject(new Error("no web audio"));
      ctx = new AC();
      const bin = atob(AUDIO_SRC.split(",")[1]);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      bufP = new Promise((res, rej) => {
        const r = ctx.decodeAudioData(bytes.buffer, res, rej);
        if (r && r.catch) r.catch(rej);
      });
      bufP.catch(() => {});
    }
    if (!gesture && ctx.state !== "running") {
      const e = new Error("blocked");
      e.name = "NotAllowedError";
      return Promise.reject(e);
    }
    return ctx.resume().then(() => bufP).then(buf => {
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);
      src.start(0);
    });
  }

  function playSound(gesture) {
    let p;
    try { p = audio.play(); } catch (e) { p = Promise.reject(e); }
    return Promise.resolve(p).catch(err => {
      if (err && err.name === "NotAllowedError" && !gesture) throw err;
      return webAudio(gesture);
    });
  }

  function waitForTap() {
    hint.hidden = false;
    const events = ["click", "touchend", "keydown"];
    const go = () => {
      events.forEach(t => window.removeEventListener(t, go));
      playSound(true).catch(() => {});
      begin();
    };
    events.forEach(t => window.addEventListener(t, go));
  }

  playSound(false).then(begin).catch(waitForTap);
})();
</script>
